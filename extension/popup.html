<!DOCTYPE html>
<html>
<head>
    <title>HearRead AI</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="popup-container">
    <div class="glass-card">
        <div class="header">
            <span class="logo">HearRead <span class="ai-tag">AI</span></span>
        </div>
        
        <div class="status-section">
            <p id="status-text">Ready to Read</p>
            <div id="progress-bar" class="hidden">
                <div class="progress-fill"></div>
            </div>
        </div>

        <button id="capture-btn" class="primary-btn">
            SCAN SCREEN
        </button>

        <div id="player-controls" class="hidden">
            <div class="now-playing">
                <p id="current-text">Extracting text...</p>
            </div>
            <div class="control-row">
                <button id="prev-btn" class="icon-btn">⏮</button>
                <button id="play-pause-btn" class="icon-btn large">▶</button>
                <button id="next-btn" class="icon-btn">⏭</button>
            </div>
            <div class="settings-row">
                <select id="voice-select">
                    <option value="af_bella">Bella (Female)</option>
                    <option value="am_adam">Adam (Male)</option>
                    <option value="bf_emma">Emma (British)</option>
                    <option value="bm_george">George (Male)</option>
                </select>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
